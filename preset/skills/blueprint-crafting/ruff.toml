# Dev lint config for the skill's OWN infra source (scripts/test).
# This is NOT a runtime dependency. The infra stays stdlib-only; ruff is a standalone
# dev tool. If ruff is absent, the self-lint gate skips with a clear message rather
# than failing — mirroring cross-source-review's lint_self.py (rule 7: mirror the
# closest exemplar).
#
# MIRRORED VERBATIM from skills/cross-source-review/ruff.toml (itself mirrored from
# skills/parallel-development/ruff.toml — rule 7). Same rule set, same rationale:
# real bug-catchers (E4/E7/E9 + F) with no style churn. The repo-root pyproject.toml
# selects the broader E/F/W/I/UP/B/SIM set and enforces E501 (line-length 100); that
# set flags this skill's long docstring lines, so this per-skill override is deliberate
# and matches csr/pd/psv EXACTLY (E501 NOT enforced — consistent with markdownlint
# MD013 off; no line is rejected for length). Do not "widen" without re-deriving the
# rule-7 rationale (a green `ruff check infra/` is the skill passing its own Fast Gate,
# dogfooding). Run:  ruff check infra/

[lint]
select = ["E4", "E7", "E9", "F"]
# E501 (line-too-long) is explicitly NOT enforced — consistent with markdownlint
# MD013 off. No line is ever rejected for length.
ignore = ["E501"]
