# Dev lint config for the skill's OWN infra source (scripts/test).
# This is NOT a runtime dependency. The infra stays stdlib-only; ruff is a standalone
# dev tool. If ruff is absent, the self-lint gate skips with a clear message rather
# than failing — mirroring primary-source-verification's lint_self.py (rule 7: mirror
# the closest exemplar, which mirrors csr/pd).
#
# MIRRORED VERBATIM from skills/primary-source-verification/ruff.toml (itself mirrored
# from csr/pd — rule 7). Same rule set, same rationale: real bug-catchers (E4/E7/E9 + F)
# with no style churn. The repo-root pyproject.toml selects the broader set; this
# per-skill override is deliberate and matches psv/csr/pd exactly — do not "widen" it
# without re-deriving the rule-7 rationale (a green `ruff check infra/` is the skill
# passing its own Fast Gate, dogfooding). Run:  ruff check infra/

[lint]
select = ["E4", "E7", "E9", "F"]
# E501 (line-too-long) is explicitly NOT enforced — consistent with markdownlint
# MD013 off. No line is ever rejected for length.
ignore = ["E501"]
