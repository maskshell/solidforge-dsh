# Vale prose-lint configuration — STARTING POINT (scaffolded by `arm.py --scaffold-configs`).
# Vale styles are OPINION (no objective default); this is a sensible starting set, not a
# verdict. Tune StylesPath + MinAlertLevel + the Vale packages to your house style.
#
# The vale_adapter.py convergence gate runs `vale --output=JSON` against this config.
# The adapter COLLAPSES suggestion/warning/error to `warning` (advisory, never blocker).
#
# REQUIRED STEP after scaffolding: run `vale sync` to fetch the style packages below into
# .vale/styles/ — the gate no-ops until then. arm.py runs `vale sync` automatically when
# `vale` is on $PATH. Commit .vale/styles/ for CI reproducibility, or gitignore it.
#
# Docs: https://vale.sh/docs/

StylesPath = .vale/styles

# Style packages pulled from the Vale registry by `vale sync`.
Vale.terms = v0      # project terminology substitutions
Microsoft = v0       # Microsoft Writing Style Guide
Google = v0          # Google developer-doc style
Proselint = v0       # grammar / phrasing
Alex = v0            # inclusive language (racism / sexism / ableism checks)

# Minimum severity to report. The adapter collapses all levels to `warning` regardless.
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Vale, Microsoft, Google, Proselint, Alex
