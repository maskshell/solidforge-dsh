# import-linter configuration template (Python Architecture-Contract Gate).
# Copy to project root and edit layers/forbidden to match your project.
# Docs: https://import-linter.readthedocs.io/
#
# The arch_contract_python.py gate runs `lint-imports --config .importlinter.ini`.
# Lower layers must not import higher layers.
#
# NEUTRAL BY DEFAULT: the layer/forbidden contracts below are COMMENTED OUT so a
# freshly-armed project has a GREEN gate (0 active contracts = nothing to violate).
# Uncomment + edit the [importlinter:contract:*] blocks to enforce YOUR layering.

[importlinter]
# arm.py auto-detects your root package and substitutes it here. If detection
# failed (unusual layout), it reads __REPLACE_ME__ — set it manually to your
# importable top-level package (e.g. myproj, not src/myproj).
root_package = __REPLACE_ME__

# --- Uncomment + edit to enforce YOUR layering -------------------------------
# [importlinter:contract:layers]
# name = Layered architecture
# type = layers
# layers =
#     myproj.api
#     myproj.services
#     myproj.repositories
#     myproj.models
#
# [importlinter:contract:forbidden-repo-to-api]
# name = Repositories must not import the API layer
# type = forbidden
# source_modules =
#     myproj.repositories
# forbidden_modules =
#     myproj.api
