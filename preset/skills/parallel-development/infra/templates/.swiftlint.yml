# SwiftLint configuration template (Swift Architecture-Contract Gate).
# Copy to project root. The arch_contract_swift.py gate runs:
#   swiftlint lint --config .swiftlint.yml
# plus `swift build -Xswiftc -strict-concurrency=complete` for the concurrency baseline.
#
# NEUTRAL BY DEFAULT: no `included:` (scans the whole project) + standard excludes.
# The example custom_rules (layer/boundary contracts) are COMMENTED OUT so a freshly-
# armed project has a GREEN gate. Uncomment + edit to enforce YOUR boundaries.

excluded:
  - .build
  - DerivedData
  - build
  - Pods
  - .swiftpm

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - unowned_variable_capture
  - retroactive_conformance
  - empty_count
  - first_where

# Line-length NOT enforced — consistent with the repo convention.
disabled_rules:
  - line_length

