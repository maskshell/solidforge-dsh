name: publish-npm

# npm trusted publishing (OIDC): no tokens, no OTP. The npm package
# (unscoped `solidforge`, formerly @maskshell/solidforge) trusts this repo +
# workflow path (configured once on the npm website), so the registry
# validates the GitHub OIDC identity at publish time. Trigger: manual
# dispatch, or a push of a v* tag.
#
# IMPORTANT: version bumps happen in packages/solidforge-plugin/package.json;
# tag the commit `v<version>` and push to publish.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Skip when the version is already published (idempotent tag runs)
        id: version-check
        working-directory: packages/solidforge-plugin
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "already-published=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} already exists on npm — skipping publish"
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish (name/version read from package.json)
        if: steps.version-check.outputs.already-published != 'true'
        working-directory: packages/solidforge-plugin
        # No token: with id-token: write + trusted publishing configured on
        # npm, the CLI performs the OIDC exchange with the registry itself.
        # The first publish after the 2026-09-04 rename to unscoped
        # `solidforge` was manual (trusted-publisher pre-registration is
        # unavailable for not-yet-published names); the guard above keeps
        # tag-triggered runs idempotent from then on.
        run: npm publish --provenance --access public
